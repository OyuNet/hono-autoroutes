name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  bun-checks:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck:public
      - run: bun test
      - run: bun run build
      - run: bun run smoke

  node-smoke:
    strategy:
      matrix:
        node: [18, 20, 22]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}

      - run: npm install --ignore-scripts
      - run: npm run build
      - run: npm run smoke
